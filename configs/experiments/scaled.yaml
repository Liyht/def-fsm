# Proportionate upsampling mixture: every source is oversampled to the volume of
# the largest split while preserving the 1:1 HH:HA and 4:1 Fisher:Switchboard
# ratios.
#
# The multipliers are taken against the unscaled Fisher split: Switchboard
# 1,551k x 3.51 and ShareGPT 2,966k x 9.18. The step budget grows from 300 to
# 700 to accommodate the larger corpus.
training:
  output_dir: "${CHECKPOINT_ROOT}/def_fsm_scaled"
  per_device_train_batch_size: 8
  max_train_steps: 700

dataset:
  assistant:
    dataset_ratios:
      switchboard: 3.5128
      fisher: 1.0
      shareGPT: 9.1849
      synthetic: 0.0
